name: "Godot CI/CD"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build installer independently'
        required: false
        type: boolean
        default: true


permissions:
  contents: write

jobs:
  # Gate before the expensive job runs at all - a tag push alone shouldn't
  # be enough to burn a full Rust+Godot export+installer build. Compares
  # this tag against the previous v* release tag and only lets the real
  # build proceed if there's a meaningful amount of change between them.
  # Manual runs (workflow_dispatch) always bypass this - that's an explicit
  # "build it now regardless" action, not something to second-guess.
  check-changes:
    name: Check for meaningful changes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout (full history - need every tag to compare against)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare against the previous release tag
        id: check
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          # Newest OTHER v* tag, ordered by the date of the commit it
          # points at (not alphabetically - v1.0.9 must sort before
          # v1.0.10, which plain string sort gets wrong).
          PREV_TAG=$(git tag -l 'v*' --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found - first release, building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $CURRENT_TAG against previous release $PREV_TAG"

          # Major version upgrade check (e.g., v1.x.x -> v2.0.0)
          CURR_MAJOR=$(echo "$CURRENT_TAG" | sed -E 's/^v([0-9]+).*/\1/')
          PREV_MAJOR=$(echo "$PREV_TAG" | sed -E 's/^v([0-9]+).*/\1/')
          if [ -n "$CURR_MAJOR" ] && [ -n "$PREV_MAJOR" ] && [ "$CURR_MAJOR" != "$PREV_MAJOR" ]; then
            echo "Major version upgrade detected ($PREV_MAJOR -> $CURR_MAJOR) - forcing build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(git rev-parse "$PREV_TAG")" = "$(git rev-parse "$CURRENT_TAG")" ]; then
            echo "This tag points at the exact same commit as $PREV_TAG - nothing changed, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "Enough changes" bar: at least MIN_COMMITS commits OR MIN_FILES
          # distinct non-doc files touched since the previous release.
          # Deliberately a rough heuristic, not a precise science - the
          # goal is "worthwhile for players to download," not a strict
          # formula. Tune these two numbers if the bar feels wrong.
          MIN_COMMITS=3
          MIN_FILES=5

          COMMIT_COUNT=$(git rev-list --count "${PREV_TAG}..${CURRENT_TAG}")
          # Markdown docs (README, STORY_SCRIPT, Status.md, ...) don't
          # change what ships in the game - excluded so a doc-only tag
          # doesn't false-positive its way past the file-count bar.
          FILE_COUNT=$(git diff --name-only "${PREV_TAG}..${CURRENT_TAG}" -- . ':!*.md' | wc -l)

          echo "Commits since $PREV_TAG: $COMMIT_COUNT"
          echo "Non-doc files changed since $PREV_TAG: $FILE_COUNT"

          if [ "$COMMIT_COUNT" -ge "$MIN_COMMITS" ] || [ "$FILE_COUNT" -ge "$MIN_FILES" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Below the meaningful-change threshold (need >= $MIN_COMMITS commits or >= $MIN_FILES non-doc files) - skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  export-windows:
    name: Windows Export
    needs: check-changes
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.should_build == 'true')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Setup Godot 4.6.3
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath . -Force

          $TemplatesDir = "$env:APPDATA\Godot\export_templates\4.6.3.stable"
          New-Item -ItemType Directory -Force -Path $TemplatesDir | Out-Null

          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -OutFile templates.zip
          Expand-Archive -Path templates.zip -DestinationPath . -Force
          Move-Item -Path "templates\*" -Destination $TemplatesDir -Force
        shell: pwsh

      - name: Build Installer
        run: .\build_installer.ps1
        shell: pwsh

      # Runs unconditionally (every trigger, not just tag pushes) - a
      # manual workflow_dispatch run built the installer successfully but
      # had no way to actually retrieve it (the step below only fires on
      # a tag push), so a manual "build me an installer now" run silently
      # discarded its own output. This is the download link for that case:
      # grab it from the run's Summary page, host it wherever you like -
      # no GitHub Release required.
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixbots-Installer
          path: Pixbots-Installer.exe
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Pixbots-Installer.exe
          generate_release_notes: true

  export-linux:
    name: Linux Export
    needs: [check-changes, export-windows]
    # Sequenced after export-windows (not parallel) so the two jobs never
    # race to create the same GitHub Release simultaneously -
    # softprops/action-gh-release updates an existing release for the same
    # tag rather than duplicating it, but only if the first one has
    # already landed. always()/!cancelled() so a Windows-side failure
    # doesn't block Linux from still attempting its own build.
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Godot 4.6.3
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

          TemplatesDir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$TemplatesDir"
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -O templates.zip
          unzip -q templates.zip
          mv templates/* "$TemplatesDir"/

      # Same reasoning as the Windows job: rust_ext only depends on the
      # cross-platform godot-rust crate (no platform-specific deps), so
      # this is a normal native compile on this runner, not a cross-
      # compile - both the release AND debug .so are needed (debug for
      # the script-class-cache warm-up pass below, release for the actual
      # export), matching rust_ext.gdextension's linux.debug/release.
      # x86_64 entries.
      - name: Build Rust Extension (Debug & Release)
        run: |
          cd rust_ext
          cargo build --release
          cargo build
          test -f target/release/librust_ext.so
          test -f target/debug/librust_ext.so

      - name: Compile Dialogues
        run: |
          python3 tools/compile_dialogue.py
          python3 tools/inject_monologues.py

      # Same "fresh checkout has no script-class cache yet" reasoning as
      # build_installer.ps1's own warm-up pass - --editor is required to
      # trigger the EditorFileSystem project scan headlessly.
      - name: Warm up the script-class cache
        run: ./Godot_v4.6.3-stable_linux.x86_64 --headless --editor --quit || true

      - name: Export Godot Project (Linux)
        run: |
          mkdir -p builds/linux
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --export-release "Linux/X11"
          test -f builds/linux/Pixbots-G.x86_64
          chmod +x builds/linux/Pixbots-G.x86_64

      # No Inno-Setup equivalent on Linux - a tarball containing the
      # binary, the mech-icon PNG, and install.sh (extract-then-run,
      # installs to ~/.local/share, registers a real app-menu launcher)
      # is the standard minimal packaging for an indie Linux release.
      - name: Package release tarball
        run: |
          mkdir -p dist/Pixbots-G-linux
          cp builds/linux/Pixbots-G.x86_64 dist/Pixbots-G-linux/
          cp icon.png dist/Pixbots-G-linux/
          cp installer/install.sh dist/Pixbots-G-linux/
          chmod +x dist/Pixbots-G-linux/install.sh dist/Pixbots-G-linux/Pixbots-G.x86_64
          tar -czf Pixbots-G-linux.tar.gz -C dist Pixbots-G-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixbots-Linux
          path: Pixbots-G-linux.tar.gz
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Pixbots-G-linux.tar.gz
          generate_release_notes: true
