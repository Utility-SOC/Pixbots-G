[package]
name = "pixbots_core"
version = "0.1.0"
edition = "2021"
description = "Engine-agnostic Pixbots simulation/geometry core: pure std Rust, no Godot types, testable with cargo test."

# No dependencies on purpose: this crate is the part that must survive leaving Godot (Pixelbots 2, a Rust-native
